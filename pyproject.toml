[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ovpnx"
version = "0.7.0"
description = "Simple VPN manager for cybersecurity labs (HTB, THM, ...) on Linux and WSL2"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]

[project.scripts]
ovpnx = "ovpnx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
